<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendly — Student Attendance</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">STUDENT TOOLKIT</span><h1>Attendly<span>.</span></h1><p>Know where you stand. Plan what comes next.</p></div><button id="reset" class="ghost">Reset demo</button></header>
<section class="hero"><div><span class="eyebrow">OVERALL ATTENDANCE</span><div class="big" id="overall">—%</div><p id="status">Add your classes to get started.</p></div><div class="ring" id="ring"><span id="ringText">0%</span></div></section>
<section class="stats"><article><small>Classes attended</small><strong id="attended">0</strong></article><article><small>Total classes</small><strong id="total">0</strong></article><article><small>Classes to 75%</small><strong id="needed">0</strong></article></section>
<section class="panel"><div class="panel-head"><div><span class="eyebrow">YOUR SUBJECTS</span><h2>Attendance tracker</h2></div><button id="add">+ Add subject</button></div><div id="subjects" class="subjects"></div></section>
<footer>Attendly · Data stays in your browser</footer></main><dialog id="modal"><form method="dialog" id="subjectForm"><h2>Add a subject</h2><label>Subject name<input id="subjectName" required maxlength="40" placeholder="e.g. Mathematics"></label><label>Classes attended<input id="subjectAttended" type="number" min="0" value="0" required></label><label>Total classes<input id="subjectTotal" type="number" min="0" value="0" required></label><div class="actions"><button class="ghost" value="cancel">Cancel</button><button id="save" value="default">Add subject</button></div></form></dialog><script src="app.js"></script></body></html>
